{% extends "base.html" %}
{% block title %}Donation Report - LifeBlood{% endblock %}
{% block body %}
<div class="container-fluid">
    <div class="row">
        <nav class="col-md-2 bg-light sidebar min-vh-100">
            <div class="position-sticky pt-3">
                <ul class="nav flex-column">
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('staff.dashboard') }}">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('staff.donors') }}">Donors</a></li>
                    <li class="nav-item"><a class="nav-link active" href="{{ url_for('reports.donation_report') }}">Reports</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('reports.request_report') }}">Request Report</a></li>
                </ul>
            </div>
        </nav>
        <main class="col-md-10 ms-sm-auto px-md-4 py-4">
            <h2>Donation Report</h2>
            <div class="row g-3 mt-2">
                <div class="col-md-3">
                    <div class="card text-white bg-primary">
                        <div class="card-body">
                            <h5 class="card-title">Total Donations</h5>
                            <p class="card-text display-6">{{ total_donations }}</p>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card text-white bg-success">
                        <div class="card-body">
                            <h5 class="card-title">Accepted</h5>
                            <p class="card-text display-6">{{ accepted }}</p>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card text-white bg-danger">
                        <div class="card-body">
                            <h5 class="card-title">Rejected</h5>
                            <p class="card-text display-6">{{ rejected }}</p>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>
{% endblock %}
